<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* CASA CARILO — fiel al anteproyecto (carpeta jun-2026)
   x este(+)/oeste(-) · z sur/parque(+) / norte/calle(-) · y altura
   Niveles: garage 0 · PB 3.2 · 1er 6.6 · torre 9.8 */

const $=s=>document.querySelector(s);
const renderer=new THREE.WebGLRenderer({canvas:$('#escena'),antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.35));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=.95;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const escena=new THREE.Scene();
escena.fog=new THREE.Fog(0xDCC3A2,150,520);

const cam=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.08,500);
cam.position.set(-26,15,-26);

const pmrem=new THREE.PMREMGenerator(renderer);
escena.environment=pmrem.fromScene(new RoomEnvironment(renderer),.04).texture;

/* ===== CIELO ATMOSFÉRICO (atardecer dorado) ===== */
const cielo=new Sky();
cielo.scale.setScalar(2000);
escena.add(cielo);
const U=cielo.material.uniforms;
U.turbidity.value=6; U.rayleigh.value=2.2;
U.mieCoefficient.value=.02; U.mieDirectionalG.value=.85;
const solDir=new THREE.Vector3().setFromSphericalCoords(1, THREE.MathUtils.degToRad(90-11), THREE.MathUtils.degToRad(-118));
U.sunPosition.value.copy(solDir);

/* ===== LUCES ===== */
const sol=new THREE.DirectionalLight(0xFFCE96,2.6);
sol.position.copy(solDir).multiplyScalar(60);
sol.castShadow=true;
sol.shadow.mapSize.set(1024,1024);
Object.assign(sol.shadow.camera,{left:-42,right:42,top:45,bottom:-45,far:160});
sol.shadow.bias=-0.0004;
escena.add(sol);
escena.add(new THREE.HemisphereLight(0xF4C48E,0x4a5a3a,.55));

/* ===== POST: bloom cine ===== */
const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(escena,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),.16,.6,.9);
composer.addPass(bloom);
composer.addPass(new OutputPass());
function foco(x,y,z,int=14,color=0xFFE7C0){const l=new THREE.PointLight(color,int,11,1.8);l.position.set(x,y,z);escena.add(l);}

/* ===== TEXTURAS ===== */
function tex(fn,rx,ry){const c=document.createElement('canvas');c.width=c.height=256;fn(c.getContext('2d'),256,256);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=THREE.SRGBColorSpace;return t;}
const txMadera=tex((g,w,h)=>{g.fillStyle='#8a6a45';g.fillRect(0,0,w,h);
  for(let i=0;i<26;i++){g.fillStyle='rgba('+(60+Math.random()*30|0)+','+(42+Math.random()*22|0)+','+(25+Math.random()*15|0)+',.45)';g.fillRect(0,i*10,w,4+Math.random()*4);}},3,3);
const txListones=tex((g,w,h)=>{g.fillStyle='#9c7850';g.fillRect(0,0,w,h);
  for(let x=0;x<w;x+=18){g.fillStyle='rgba(58,40,24,'+(0.35+Math.random()*0.3)+')';g.fillRect(x,0,3,h);g.fillStyle='rgba(255,235,200,'+(0.06+Math.random()*0.08)+')';g.fillRect(x+3,0,6,h);}},4,1);
const txPiedra=tex((g,w,h)=>{g.fillStyle='#8d8578';g.fillRect(0,0,w,h);
  for(let i=0;i<70;i++){const x=Math.random()*w,y=Math.random()*h,r=8+Math.random()*22;
    g.fillStyle='rgba('+(100+Math.random()*50|0)+','+(95+Math.random()*45|0)+','+(85+Math.random()*40|0)+',.7)';
    g.beginPath();g.ellipse(x,y,r,r*.65,Math.random()*3,0,7);g.fill();g.strokeStyle='rgba(50,45,40,.35)';g.stroke();}},3,2);
const txHormigon=tex((g,w,h)=>{g.fillStyle='#b9b6ae';g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){g.fillStyle='rgba('+(90+Math.random()*90|0)+','+(90+Math.random()*85|0)+','+(85+Math.random()*80|0)+',.09)';g.fillRect(Math.random()*w,Math.random()*h,2,2);}},2,2);
const txDeck=tex((g,w,h)=>{g.fillStyle='#a07c52';g.fillRect(0,0,w,h);
  for(let y=0;y<h;y+=22){g.fillStyle='rgba(60,42,26,.5)';g.fillRect(0,y,w,3);g.fillStyle='rgba(255,240,210,.05)';g.fillRect(0,y+3,w,5);}},2,4);
const txPasto=tex((g,w,h)=>{g.fillStyle='#6d8f4e';g.fillRect(0,0,w,h);
  for(let i=0;i<1400;i++){g.fillStyle='rgba('+(70+Math.random()*60|0)+','+(110+Math.random()*60|0)+','+(50+Math.random()*40|0)+',.25)';g.fillRect(Math.random()*w,Math.random()*h,2,3);}},26,26);

/* ===== MATERIALES ===== */
const M={
  madera:new THREE.MeshStandardMaterial({map:txMadera,roughness:.75}),
  listones:new THREE.MeshStandardMaterial({map:txListones,roughness:.7}),
  piedra:new THREE.MeshStandardMaterial({map:txPiedra,roughness:.92}),
  hormigon:new THREE.MeshStandardMaterial({map:txHormigon,roughness:.85}),
  interior:new THREE.MeshStandardMaterial({color:0xF2EDE2,roughness:.95}),
  piso:new THREE.MeshStandardMaterial({map:txMadera,roughness:.6}),
  deck:new THREE.MeshStandardMaterial({map:txDeck,roughness:.8}),
  techo:new THREE.MeshStandardMaterial({color:0x4a3626,roughness:.8}),
  vidrio:new THREE.MeshPhysicalMaterial({color:0xCFE8F0,metalness:0,roughness:.05,transmission:.88,thickness:.05,ior:1.45,transparent:true,opacity:.92}),
  marco:new THREE.MeshStandardMaterial({color:0x2b2b2b,roughness:.5,metalness:.4}),
  agua:new THREE.MeshPhysicalMaterial({color:0x2E9AC4,roughness:.08,metalness:0,transparent:true,opacity:.88}),
  verde:new THREE.MeshStandardMaterial({color:0x2c5c33,roughness:.9}),
  tronco:new THREE.MeshStandardMaterial({color:0x5a4128,roughness:.9}),
  tela:new THREE.MeshStandardMaterial({color:0xD9D2C0,roughness:.95}),
  telaOscura:new THREE.MeshStandardMaterial({color:0x6b7280,roughness:.95}),
  asfalto:new THREE.MeshStandardMaterial({color:0x565a5e,roughness:.95}),
};

/* ===== COLECCIONES ===== */
const pisables=[], solidos=[];
function caja(w,h,d,mat,x,y,z,opts={}){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y+h/2,z);
  m.castShadow=opts.cs!==false; m.receiveShadow=true;
  escena.add(m);
  if(opts.solido!==false) solidos.push(m);
  return m;
}
function piso(w,d,x,y,z,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,.14,d),mat);
  m.position.set(x,y-.07,z); m.receiveShadow=true; m.castShadow=true;
  escena.add(m); pisables.push(m); return m;
}
/* muro a lo largo de X (en un z fijo) con aberturas [x1,x2] */
function muroX(z,x1,x2,y0,h,mat,aber=[],esp=.18){
  const cortes=[x1,...aber.flat().sort((a,b)=>a-b),x2];
  for(let i=0;i<cortes.length;i+=2){
    const a=cortes[i],b=cortes[i+1];
    if(b-a>.05) caja(b-a,h,esp,mat,(a+b)/2,y0,z);
  }
}
function muroZ(x,z1,z2,y0,h,mat,aber=[],esp=.18){
  const cortes=[z1,...aber.flat().sort((a,b)=>a-b),z2];
  for(let i=0;i<cortes.length;i+=2){
    const a=cortes[i],b=cortes[i+1];
    if(b-a>.05) caja(esp,h,b-a,mat,x,y0,(a+b)/2);
  }
}
function vidrioX(z,x1,x2,y0,h){caja(x2-x1,h,.06,M.vidrio,(x1+x2)/2,y0,z,{cs:false});caja(x2-x1,.08,.1,M.marco,(x1+x2)/2,y0,z);caja(x2-x1,.08,.1,M.marco,(x1+x2)/2,y0+h-.08,z);}
function vidrioZ(x,z1,z2,y0,h){caja(.06,h,z2-z1,M.vidrio,x,y0,(z1+z2)/2,{cs:false});caja(.1,.08,z2-z1,M.marco,x,y0,(z1+z2)/2);caja(.1,.08,z2-z1,M.marco,x,y0+h-.08,(z1+z2)/2);}
function barandaX(z,x1,x2,y0){caja(x2-x1,.06,.08,M.madera,(x1+x2)/2,y0+1.0,z);caja(x2-x1,1.0,.04,M.vidrio,(x1+x2)/2,y0,z,{cs:false});}
function barandaZ(x,z1,z2,y0){caja(.08,.06,z2-z1,M.madera,x,y0+1.0,(z1+z2)/2);caja(.04,1.0,z2-z1,M.vidrio,x,y0,(z1+z2)/2,{cs:false});}

/* ===== TERRENO (médano en subida: calle norte baja → parque sur alto) ===== */
function suave(a,b,t){t=Math.max(0,Math.min(1,(t-a)/(b-a)));return t*t*(3-2*t);}
function terrenoY(x,z){
  let y=suave(-14,8,z)*3.2 + suave(8,34,z)*3.0;          // 0 → 3.2 → 6.2
  if(x>-1.6&&x<3.6&&z<-7.6&&z>-24) y=Math.min(y,0);      // rampa de autos plana
  if(x>-7.2&&x<7.2&&z>-8.4&&z<8.4) y=Math.min(y,3.05);   // la casa asienta
  if(x>-6&&x<6&&z>19.5&&z<32.5) y=4.9;                    // plateau pileta
  if(z<-16) y=0;
  return y;
}
{
  const g=new THREE.PlaneGeometry(110,130,110,130);
  g.rotateX(-Math.PI/2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){p.setY(i,terrenoY(p.getX(i),p.getZ(i)));}
  g.computeVertexNormals();
  const terreno=new THREE.Mesh(g,new THREE.MeshStandardMaterial({map:txPasto,roughness:.95}));
  terreno.receiveShadow=true;
  escena.add(terreno); pisables.push(terreno);
}
/* calles (esquina Divisadero oeste × Constancia norte) */
{
  const c1=new THREE.Mesh(new THREE.PlaneGeometry(110,8),M.asfalto);c1.rotation.x=-Math.PI/2;c1.position.set(0,.03,-21);c1.receiveShadow=true;escena.add(c1);
  const c2=new THREE.Mesh(new THREE.PlaneGeometry(8,60),M.asfalto);c2.rotation.x=-Math.PI/2;c2.position.set(-19,.03,3);c2.receiveShadow=true;escena.add(c2);
  const rampa=new THREE.Mesh(new THREE.PlaneGeometry(5,9.5),M.hormigon);rampa.rotation.x=-Math.PI/2;rampa.position.set(1,.05,-12.5);rampa.receiveShadow=true;escena.add(rampa);
}

/* ============================================================
   LA CASA
============================================================ */
const NG=0, NPB=3.2, N1=6.6, NT=9.8;
const ALT=2.95;

/* ---------- GARAGE (12.5 × 11 · calle) ---------- */
piso(12.5,11,0,NG+.01,-2.25,M.hormigon);
muroX(-7.75,-6.25,6.25,NG,3.2,M.piedra,[[-1.5,3.5]]);          // frente norte con portón
caja(5,0.7,.2,M.listones,1,NG+2.5,-7.75);                       // dintel listones
muroX(3.25,-6.25,6.25,NG,3.2,M.piedra);                         // fondo sur (contra médano)
muroZ(-6.25,-7.75,3.25,NG,3.2,M.piedra);                        // oeste
muroZ(6.25,-7.75,3.25,NG,3.2,M.piedra);                         // este
/* vinoteca de vidrio 3×4 con estantes */
{
  const vx1=-5.9,vx2=-2.9,vz1=-3.0,vz2=1.0;
  vidrioX(vz1,vx1,vx2,NG,2.6); vidrioX(vz2,vx1,vx2,NG,2.6);
  vidrioZ(vx1,vz1,vz2,NG,2.6);

const rayPiso=new THREE.Raycaster(); rayPiso.far=12;
const rayMuro=new THREE.Raycaster(); rayMuro.far=.55;
const ARRIBA=new THREE.Vector3(0,-1,0);

function alturaPisoEn(x,yRef,z){
  rayPiso.set(new THREE.Vector3(x,yRef+0.85,z),ARRIBA);
  const h=rayPiso.intersectObjects(pisables,false);
  return h.length?h[0].point.y:null;
}
function caminar(dt){
  const vel=(teclas.ShiftLeft?6:3.4)*dt;
  const dir=new THREE.Vector3();
  cam.getWorldDirection(dir); dir.y=0; dir.normalize();
  const lado=new THREE.Vector3().crossVectors(dir,new THREE.Vector3(0,1,0));
  const mv=new THREE.Vector3();
  if(teclas.KeyW||teclas.ArrowUp||adelante) mv.add(dir);
  if(teclas.KeyS||teclas.ArrowDown||atras) mv.sub(dir);
  if(teclas.KeyD||teclas.ArrowRight) mv.add(lado);
  if(teclas.KeyA||teclas.ArrowLeft) mv.sub(lado);
  if(!mv.lengthSq()) return;
  mv.normalize().multiplyScalar(vel);
  const p=cam.position;
  /* choque con muros */
  rayMuro.set(new THREE.Vector3(p.x,p.y-.5,p.z),mv.clone().normalize());
  if(rayMuro.intersectObjects(solidos,false).length) return;
  const nx=p.x+mv.x, nz=p.z+mv.z;
  const hy=alturaPisoEn(nx,p.y-1.0,nz);
  if(hy===null) return;
  const objetivo=hy+1.62;
  if(Math.abs(objetivo-p.y)>0.75 && objetivo>p.y) return;   // pared/salto muy alto
  p.x=nx; p.z=nz;
  p.y+=(objetivo-p.y)*Math.min(1,dt*10);
}

const lugares={
  orbita:{modo:'orbita',pos:[-26,15,-26],target:[0,5,1],txt:'VISTA EXTERIOR'},
  frente:{modo:'caminar',pos:[-2,1.62,-14],mira:[0,4,0],txt:'FRENTE · CALLE CONSTANCIA'},
  garage:{modo:'caminar',pos:[2.5,NG+1.62,-5.5],mira:[-4,NG+1.4,-1],txt:'GARAGE · VINOTECA'},
  pb:{modo:'caminar',pos:[-1.5,NPB+1.62,2.0],mira:[0,NPB+2.4,7.7],txt:'PLANTA BAJA · LIVING DOBLE ALTURA'},
  p1:{modo:'caminar',pos:[-3,N1+1.62,0.2],mira:[-2,N1+1.2,2.8],txt:'1ER PISO · BIBLIOTECA-BALCÓN'},
  suite:{modo:'caminar',pos:[2.2,NT+1.62,6.8],mira:[3.5,NT+1.4,2.0],txt:'2º PISO · SUITE (TORRE)'},
  parque:{modo:'caminar',pos:[0,4.9+1.62,24.5],mira:[0,6,8],txt:'PARQUE · PILETA'},
};
function irA(nombre){
  const L=lugares[nombre];
  document.querySelectorAll('.nb').forEach(b=>b.classList.toggle('on',b.dataset.ir===nombre));
  $('#lugar-txt').textContent=L.txt;
  if(L.modo==='orbita'){
    if(lock.isLocked) lock.unlock();
    modo='orbita'; orbit.enabled=true;
    cam.position.set(...L.pos); orbit.target.set(...L.target);
    $('#entrar').style.display='block'; $('#mira').style.display='none';
    $('#hint').innerHTML='<b>ARRASTRÁ</b> para girar la casa · <b>RUEDA</b> para acercarte';
  }else{
    modo='caminar'; orbit.enabled=false;
    cam.position.set(...L.pos);
    cam.lookAt(...L.mira);
    $('#entrar').style.display='none'; $('#mira').style.display='block';
    $('#hint').innerHTML='<b>MOUSE</b> mirar · <b>CLIC IZQ (mantener)</b> caminar · <b>CLIC DER</b> atrás · <b>WASD</b> también · <b>ESC</b> soltar';
    if(!esTactil) lock.lock();
  }
}
const esTactil=matchMedia('(hover:none)').matches;
document.querySelectorAll('.nb').forEach(b=>b.addEventListener('click',()=>irA(b.dataset.ir)));
$('#entrar').addEventListener('click',()=>irA('frente'));
lock.addEventListener('unlock',()=>{
  if(modo==='caminar'){
    $('#hint').innerHTML='<b>CLIC</b> en la pantalla para seguir caminando · o elegí un lugar arriba';
  }
});
addEventListener('click',()=>{ if(modo==='caminar'&&!lock.isLocked&&!esTactil) lock.lock(); });

/* ---------- loop ---------- */
const reloj=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(reloj.getDelta(),.05);
  const t=reloj.elapsedTime;
  if(modo==='tour'){
    tourCam.rotation.set(tourPitch,tourYaw,0,'YXZ');
    renderer.render(tourScene,tourCam);
    return;
  }
  if(modo==='orbita') orbit.update();
  else if(lock.isLocked||esTactil) caminar(dt);
  if(aguaMesh){ txAgua.offset.x=Math.sin(t*.15)*.06; txAgua.offset.y=t*.018; aguaMesh.position.y=4.62+Math.sin(t*1.1)*.012; }
  composer.render();
});
addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  tourCam.aspect=innerWidth/innerHeight; tourCam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});
setTimeout(()=>$('#loader').classList.add('off'),900);

/* ===== GALERÍA RENDERS 4K (Higgsfield) ===== */
const RENDERS=[
  {f:'renders/r1.jpg',t:'FRENTE — ATARDECER DESDE LA CALLE'},
  {f:'renders/r2.jpg',t:'LA CASA DESDE EL PARQUE Y LA PILETA'},
  {f:'renders/r3.jpg',t:'LIVING DOBLE ALTURA AL BOSQUE'},
  {f:'renders/r4.jpg',t:'COCINA CON ISLA DE PIEDRA'},
  {f:'renders/r5.jpg',t:'BIBLIOTECA ASOMADA AL LIVING'},
  {f:'renders/r6.jpg',t:'SUITE PRINCIPAL — LA TORRE'},
  {f:'renders/r7.jpg',t:'GALERÍA · PARRILLA DE NOCHE'},
  {f:'renders/r8.jpg',t:'VINOTECA DE VIDRIO — GARAGE'},
];
let galIdx=0;
const galEl=$('#galeria'), galImg=$('#gal-img'), galCap=$('#gal-cap');
function galVer(i){galIdx=(i+RENDERS.length)%RENDERS.length;galImg.src=RENDERS[galIdx].f;galCap.textContent=(galIdx+1)+' / '+RENDERS.length+' — '+RENDERS[galIdx].t;}
function galAbrir(){if(lock.isLocked)lock.unlock();galEl.style.display='flex';galVer(galIdx);}
function galCerrar(){galEl.style.display='none';}
$('#btn-renders').addEventListener('click',e=>{e.stopPropagation();galAbrir();});
$('#gal-prev').addEventListener('click',e=>{e.stopPropagation();galVer(galIdx-1);});
$('#gal-next').addEventListener('click',e=>{e.stopPropagation();galVer(galIdx+1);});
$('#gal-cerrar').addEventListener('click',e=>{e.stopPropagation();galCerrar();});
galEl.addEventListener('click',e=>e.stopPropagation());
addEventListener('keydown',e=>{
  if(e.code==='KeyR'){galEl.style.display==='none'?galAbrir():galCerrar();}
  if(galEl.style.display!=='none'){
    if(e.code==='ArrowRight')galVer(galIdx+1);
    if(e.code==='ArrowLeft')galVer(galIdx-1);
    if(e.code==='Escape')galCerrar();
  }
});
/* si los renders todavía no están subidos, ocultar el botón */
{const test=new Image();test.onerror=()=>{$('#btn-renders').style.display='none';};test.src=RENDERS[0].f;}

/* ===== TOUR 360° FOTOREAL (panoramas Higgsfield) ===== */
const PANOS=[
  {f:'panos/p1.jpg',t:'FRENTE — LA CALLE AL ATARDECER'},
  {f:'panos/p2.jpg',t:'LIVING DOBLE ALTURA'},
  {f:'panos/p3.jpg',t:'BIBLIOTECA — BALCÓN AL LIVING'},
  {f:'panos/p4.jpg',t:'SUITE PRINCIPAL — LA TORRE'},
  {f:'panos/p5.jpg',t:'GALERÍA · PARRILLA'},
  {f:'panos/p6.jpg',t:'PARQUE · PILETA'},
  {f:'panos/p7.jpg',t:'GARAGE · VINOTECA'},
];
const tourScene=new THREE.Scene();
const tourCam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.1,120);
const tourGeo=new THREE.SphereGeometry(50,64,48); tourGeo.scale(-1,1,1);
const tourMat=new THREE.MeshBasicMaterial({color:0x0E1A26});
const tourEsfera=new THREE.Mesh(tourGeo,tourMat);
tourScene.add(tourEsfera);
const tourLoader=new THREE.TextureLoader();
const tourCache={};
let tourYaw=0, tourPitch=0, tourIdx=0, arrastrando=false, ax=0, ay=0;
function tourCargar(i){
  tourIdx=(i+PANOS.length)%PANOS.length;
  document.querySelectorAll('#tour-ui [data-pano]').forEach(b=>b.classList.toggle('on',+b.dataset.pano===tourIdx));
  $('#lugar-txt').textContent='TOUR 360° — '+PANOS[tourIdx].t;
  const f=PANOS[tourIdx].f;
  if(tourCache[f]){tourMat.map=tourCache[f];tourMat.color.set(0xffffff);tourMat.needsUpdate=true;return;}
  tourLoader.load(f,tx=>{tx.colorSpace=THREE.SRGBColorSpace;tourCache[f]=tx;tourMat.map=tx;tourMat.color.set(0xffffff);tourMat.needsUpdate=true;});
}
function tourAbrir(){
  if(lock.isLocked)lock.unlock();
  modo='tour'; orbit.enabled=false;
  $('#tour-ui').style.display='flex'; $('#niveles').style.display='none';
  $('#entrar').style.display='none'; $('#btn-tour').style.display='none'; $('#mira').style.display='none';
  $('#hint').innerHTML='<b>ARRASTRÁ</b> para mirar alrededor · <b>RUEDA</b> para hacer zoom · estás PARADO en el ambiente';
  tourYaw=0;tourPitch=0;tourCam.fov=72;tourCam.updateProjectionMatrix();
  tourCargar(tourIdx);
}
function tourSalir(){
  $('#tour-ui').style.display='none'; $('#niveles').style.display='flex';
  $('#btn-tour').style.display='block';
  irA('orbita');
}
$('#btn-tour').addEventListener('click',e=>{e.stopPropagation();tourAbrir();});
$('#tour-cerrar').addEventListener('click',e=>{e.stopPropagation();tourSalir();});
document.querySelectorAll('#tour-ui [data-pano]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();tourCargar(+b.dataset.pano);}));
renderer.domElement.addEventListener('pointerdown',e=>{if(modo==='tour'){arrastrando=true;ax=e.clientX;ay=e.clientY;}});
addEventListener('pointermove',e=>{
  if(modo==='tour'&&arrastrando){
    tourYaw-=(e.clientX-ax)*.0032; tourPitch+=(e.clientY-ay)*.0032;
    tourPitch=Math.max(-1.35,Math.min(1.35,tourPitch));
    ax=e.clientX; ay=e.clientY;
  }
});
addEventListener('pointerup',()=>arrastrando=false);
addEventListener('wheel',e=>{
  if(modo==='tour'){tourCam.fov=Math.max(38,Math.min(95,tourCam.fov+e.deltaY*.03));tourCam.updateProjectionMatrix();}
},{passive:true});
/* ocultar el botón del tour hasta que los panoramas estén subidos */
{const t2=new Image();t2.onerror=()=>{$('#btn-tour').style.display='none';};t2.src=PANOS[0].f;}

/* ===== CINE: videos cinematográficos (Higgsfield) ===== */
const CLIPS=[
  'https://d8j0ntlcm91z4.cloudfront.net/user_3FN929TrRE49plwREBSlvCP4qhQ/hf_20260802_202157_bd0a54f4-70dc-4824-84ec-0ad39f964f5d.mp4',
  'https://d8j0ntlcm91z4.cloudfront.net/user_3FN929TrRE49plwREBSlvCP4qhQ/hf_20260628_235309_5f405584-7d4d-48c8-96a3-a34196bd6513.mp4',
];
const cineEl=$('#cine'), cineVid=$('#cine-video');
function cineAbrir(i=0){if(lock.isLocked)lock.unlock();cineEl.style.display='flex';cineVid.src=CLIPS[i];cineVid.play().catch(()=>{});}
$('#btn-video').addEventListener('click',e=>{e.stopPropagation();cineAbrir(0);});
document.querySelectorAll('#cine [data-clip]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();cineVid.src=CLIPS[+b.dataset.clip];cineVid.play().catch(()=>{});}));
$('#cine-cerrar').addEventListener('click',e=>{e.stopPropagation();cineVid.pause();cineEl.style.display='none';});
cineEl.addEventListener('click',e=>e.stopPropagation());
</script>
