<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Casa Cariló · Recorrido</title>
<meta name="description" content="Casa Cariló — recorrido 360°: parate en cada ambiente, mirá alrededor y caminá por la casa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>
<style>
:root{--tinta:#14110f;--crema:#f4efe6;--arena:#d9c7a7;--oro:#c8a46a;--gris:#9a9184;--vidrio:rgba(20,17,15,.62);--borde:rgba(244,239,230,.16)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--tinta);color:var(--crema);font-family:Inter,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#c.arr{cursor:grabbing}
button,a{font:inherit;color:inherit;cursor:pointer;text-decoration:none}
.panel{background:var(--vidrio);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--borde);border-radius:14px}
.bt{display:inline-block;border:1px solid var(--borde);background:var(--vidrio);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 14px;border-radius:999px;font-size:12px;letter-spacing:.06em;font-weight:500;transition:.2s}
.bt:hover{background:rgba(244,239,230,.18)}
#marca{position:fixed;top:16px;left:18px;z-index:20;font-family:'Cormorant Garamond',serif;font-size:26px;line-height:1.05;text-shadow:0 1px 14px rgba(0,0,0,.65);pointer-events:none}
#marca small{display:block;font-family:Inter;font-size:10px;letter-spacing:.28em;color:var(--arena);text-transform:uppercase;margin-top:5px}
#acciones{position:fixed;top:14px;right:14px;z-index:20;display:flex;gap:8px}
/* puntos para caminar */
#hot{position:fixed;inset:0;z-index:10;pointer-events:none;overflow:hidden}
.hs{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:6px;transform-origin:0 0;will-change:transform}
.hs .ring{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid rgba(255,255,255,.95);background:radial-gradient(circle,rgba(255,255,255,.34) 0 34%,rgba(255,255,255,.10) 36% 100%);box-shadow:0 0 0 1px rgba(0,0,0,.25),0 6px 26px rgba(0,0,0,.45);transition:background .2s,border-color .2s}
.hs:hover .ring{background:radial-gradient(circle,rgba(200,164,106,.85) 0 34%,rgba(200,164,106,.28) 36% 100%);border-color:var(--oro)}
.hs .lb{position:absolute;top:100%;margin-top:6px;white-space:nowrap;font-size:11.5px;font-weight:500;letter-spacing:.03em;padding:4px 9px;border-radius:999px;background:rgba(20,17,15,.72);border:1px solid var(--borde);color:var(--crema)}
.hs.esc .ring{display:none}
.hs.esc .lb{position:static;margin:0;font-size:12.5px;padding:8px 13px;background:rgba(244,239,230,.94);color:var(--tinta);border:0;box-shadow:0 6px 22px rgba(0,0,0,.4)}
.hs.esc:hover .lb{background:#fff}
/* ambientes */
#amb{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;max-width:calc(100vw - 20px);padding:8px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#amb::-webkit-scrollbar{display:none}
#amb .g{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gris);align-self:center;padding:0 6px 0 10px;white-space:nowrap}
#amb .g:first-child{padding-left:4px}
#amb button{border:0;background:transparent;padding:9px 12px;border-radius:9px;font-size:12.5px;white-space:nowrap;transition:.18s}
#amb button:hover{background:rgba(244,239,230,.1)}
#amb button.on{background:var(--crema);color:var(--tinta)}
/* plano */
#mapa{position:fixed;left:14px;bottom:76px;z-index:19;padding:8px;line-height:0}
#mapa svg{display:block;width:118px;height:auto}
#mapa .n{fill:rgba(244,239,230,.55);cursor:pointer;transition:.15s}
#mapa .n:hover{fill:#fff}
#mapa .n.otro{fill:rgba(244,239,230,.22)}
#mapa .n.on{fill:var(--oro)}
#ayuda{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:30;padding:16px 22px;font-size:14px;text-align:center;line-height:1.6;pointer-events:none;transition:opacity .6s}
#ayuda b{font-weight:600;color:var(--arena)}
#ayuda.off{opacity:0}
#carga{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:var(--tinta);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gris);transition:opacity .7s}
#carga.off{opacity:0;pointer-events:none}
#velo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:31;font-size:12px;color:var(--crema);letter-spacing:.14em;text-transform:uppercase;padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .25s}
#velo.on{opacity:1}
@media (max-width:760px){
 #marca{font-size:21px}
 #mapa{display:none}
 #mapa.on{display:block;bottom:74px}
 #acciones .bt{padding:9px 12px;font-size:11.5px}
 .solo-pc{display:none}
}
@media (min-width:761px){#bt-plano{display:none}}
</style>

<body>
<canvas id="c"></canvas>
<div id="hot"></div>
<div id="marca">Casa Cariló<small id="donde">Recorrido</small></div>
<div id="acciones">
  <button class="bt" id="bt-plano">Plano</button>
  <button class="bt solo-pc" id="bt-full">Pantalla completa</button>
  <a class="bt" href="index.html">Maqueta 3D</a>
</div>
<div id="mapa" class="panel"></div>
<nav id="amb" class="panel"></nav>
<div id="ayuda" class="panel"><b>Arrastrá</b> para mirar alrededor<br><b>Tocá los círculos</b> para caminar</div>
<div id="velo" class="panel">Cargando…</div>
<div id="carga">Cargando…</div>

<script type="module">
import * as THREE from 'three';

/* Coordenadas: x = este, y = norte (calle), z = arriba, en metros (las del modelo de Blender).
   Rumbo h en grados de brújula: 0 = norte (calle), 90 = este, 180 = sur (parque).
   Cada panorama es equirectangular con el NORTE en el centro; cov = grados verticales que cubre la imagen. */
const VER = '6d';
/* Versión 6D (16-nov-2026): la casa apoya sobre 10,35 m del garage y se estira 3,45 m hacia la calle;
   PB con sala de TV, recibidor y dormitorio 4 en suite; 1er piso con dormitorio 5, baño 2 y sala de juegos;
   suite en la caja de vidrio con terraza; escalera en U en el mismo lugar en los 4 niveles. */
const NODOS = [
 {id:'calle', n:'Desde la calle', g:'Exterior', p:[1.0,24.0,1.65], h:180,
   links:[['terraza',[-7.8,12.6,0.7],'Subir a la casa','esc'],['garage',[0,10.6,0.05],'Garage']]},
 {id:'terraza', n:'Terraza de entrada', g:'Exterior', p:[-0.5,7.9,4.85], h:180,
   links:[['recibidor',[-1.9,6.4,3.22],'Entrar'],['calle',[-7.8,7.3,3.25],'Bajar a la calle','esc']]},
 {id:'galeria', n:'Galería y parrilla', g:'Exterior', p:[2.4,-9.4,4.8], h:90,
   links:[['comedor'],['living'],['cocina'],['pileta'],['jardin'],['huesped',[7.2,-7.4,3.2],'Dormitorio de huéspedes']]},
 {id:'pileta', n:'Pileta y solarium', g:'Exterior', p:[-6.2,-15.5,4.8], h:90,
   links:[['galeria'],['jardin']]},
 {id:'jardin', n:'Parque', g:'Exterior', p:[2.0,-21.0,4.75], h:0,
   links:[['galeria'],['pileta'],['fondo']]},
 {id:'fondo', n:'Parque alto del fondo', g:'Exterior', p:[0.5,-36.0,7.0], h:0,
   links:[['jardin']]},
 {id:'recibidor', n:'Recibidor', g:'Planta baja', p:[-1.9,4.6,4.8], h:200,
   links:[['terraza',[-1.9,6.9,3.25],'Salir a la terraza'],['living'],['comedor'],['sala_tv',[-3.95,4.05,3.22],'Sala de TV'],['dorm4',[0.05,5.95,3.22],'Dormitorio 4'],
          ['estar',[2.2,0.95,3.75],'Subir al 1er piso','esc'],['garage',[1.9,2.2,3.1],'Bajar al garage','esc']]},
 {id:'living', n:'Living · doble altura', g:'Planta baja', p:[-3.2,-2.6,4.8], h:250,
   links:[['comedor'],['cocina'],['galeria'],['recibidor'],['sala_tv',[-3.95,4.05,3.22],'Sala de TV']]},
 {id:'comedor', n:'Comedor', g:'Planta baja', p:[1.2,-2.2,4.8], h:160,
   links:[['living'],['cocina'],['galeria'],['recibidor'],
          ['estar',[2.2,0.95,3.75],'Subir al 1er piso','esc'],['garage',[1.9,2.2,3.1],'Bajar al garage','esc']]},
 {id:'cocina', n:'Cocina', g:'Planta baja', p:[4.0,-4.6,4.8], h:300,
   links:[['comedor'],['living'],['galeria']]},
 {id:'sala_tv', n:'Sala de TV', g:'Planta baja', p:[-4.6,3.9,4.8], h:250,
   links:[['recibidor',[-3.8,4.05,3.22],'Recibidor'],['living']]},
 {id:'dorm4', n:'Dormitorio 4 en suite', g:'Planta baja', p:[3.9,4.6,4.8], h:220,
   links:[['recibidor',[0.25,5.95,3.22],'Recibidor']]},
 {id:'huesped', n:'Dormitorio de huéspedes', g:'Planta baja', p:[5.9,-3.9,4.8], h:30,
   links:[['galeria',[7.2,-7.2,3.2],'Galería']]},
 {id:'estar', n:'Estar y biblioteca', g:'1er piso', p:[-3.2,-0.3,8.2], h:225,
   links:[['dorm2',[-1.5,-0.82,6.62],'Dormitorio 2'],['dorm3',[5.4,-0.82,6.62],'Dormitorio 3'],['dorm5',[-2.6,3.4,6.62],'Dormitorio 5'],['juegos',[0.2,3.5,6.62],'Sala de juegos'],
          ['recibidor',[1.9,2.2,6.4],'Bajar a planta baja','esc'],['suite',[2.2,0.95,7.2],'Subir a la suite','esc']]},
 {id:'dorm2', n:'Dormitorio 2', g:'1er piso', p:[-1.3,-3.0,8.2], h:90,
   links:[['estar',[-1.5,-0.7,6.62],'Estar']]},
 {id:'dorm3', n:'Dormitorio 3', g:'1er piso', p:[5.6,-3.6,8.2], h:270,
   links:[['estar',[5.4,-0.7,6.62],'Estar']]},
 {id:'dorm5', n:'Dormitorio 5', g:'1er piso', p:[-3.6,4.6,8.2], h:240,
   links:[['estar',[-2.5,3.4,6.62],'Estar'],['juegos',[0.2,3.5,6.62],'Sala de juegos']]},
 {id:'juegos', n:'Sala de juegos', g:'1er piso', p:[3.3,3.3,8.2], h:90,
   links:[['estar',[0.1,3.5,6.62],'Estar'],['dorm5',[-2.6,3.4,6.62],'Dormitorio 5']]},
 {id:'suite', n:'Suite principal', g:'Suite', p:[1.7,-1.7,11.5], h:240,
   links:[['terraza_alta',[-0.5,-4.1,9.92],'Terraza'],['estar',[1.9,2.2,9.7],'Bajar al 1er piso','esc']]},
 {id:'terraza_alta', n:'Terraza de la suite', g:'Suite', p:[-5.2,-2.4,11.55], h:180,
   links:[['suite',[-0.5,-3.7,9.92],'Suite']]},
 {id:'garage', n:'Garage', g:'Garage', p:[0.0,3.8,1.6], h:0,
   links:[['vinoteca',[-3.3,3.5,0.02],'Vinoteca'],['calle',[0,10.0,0.05],'Salir a la calle'],['recibidor',[1.9,0.95,0.6],'Subir a la casa','esc']]},
 {id:'vinoteca', n:'Vinoteca', g:'Garage', p:[-3.7,0.9,1.6], h:270,
   links:[['garage',[-2.6,3.6,0.02],'Garage']]},
];
const POR_ID = Object.fromEntries(NODOS.map(n=>[n.id,n]));
const RAD = Math.PI/180;

/* ---------- visor ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
const scene = new THREE.Scene();
const cam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
const U = {
 tA:{value:null}, tB:{value:null}, uMix:{value:0}, uTan:{value:1}, uAspect:{value:1},
 uCovA:{value:Math.PI}, uCovB:{value:Math.PI}, uZoomA:{value:1}, uZoomB:{value:1},
 uF:{value:new THREE.Vector3(0,1,0)}, uR:{value:new THREE.Vector3(1,0,0)}, uU:{value:new THREE.Vector3(0,0,1)},
 uTxA:{value:new THREE.Vector2(1/2048,1/1024)}, uTxB:{value:new THREE.Vector2(1/2048,1/1024)}, uSharp:{value:0.22}
};
const mat = new THREE.ShaderMaterial({uniforms:U, depthTest:false, depthWrite:false,
 vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
 fragmentShader:`
 precision highp float;
 varying vec2 vUv;
 uniform sampler2D tA,tB; uniform float uMix,uTan,uAspect,uCovA,uCovB,uZoomA,uZoomB,uSharp;
 uniform vec3 uF,uR,uU; uniform vec2 uTxA,uTxB;
 vec2 st(vec3 d,float cov){
   float lon=atan(d.x,d.y); float lat=asin(clamp(d.z,-1.,1.));
   return vec2(lon/6.28318530718+.5, clamp(lat/cov+.5,.0015,.9985));
 }
 vec3 mira(sampler2D t,float zoom,float cov,vec2 tx){
   vec2 s=vUv*2.-1.;
   vec3 d=normalize(uF+s.x*uTan*uAspect*zoom*uR+s.y*uTan*zoom*uU);
   vec2 p=st(d,cov);
   vec3 c=texture2D(t,p).rgb;
   float fuera=abs(asin(clamp(d.z,-1.,1.)))-cov*.5;
   if(fuera>-.03){ // cenit y nadir que la foto no cubre: se funde a un degradé suave en vez de estirar la última fila
     vec3 s=vec3(0.);
     for(int k=-5;k<=5;k++){ s+=texture2D(t,vec2(p.x+float(k)*.035,p.y)).rgb; }
     c=mix(c,s/11.,smoothstep(-.03,.05,fuera));
   }else
   if(uSharp>0.){
     vec3 b=texture2D(t,p+vec2(tx.x,0.)).rgb+texture2D(t,p-vec2(tx.x,0.)).rgb+texture2D(t,p+vec2(0.,tx.y)).rgb+texture2D(t,p-vec2(0.,tx.y)).rgb;
     c=clamp(c*(1.+4.*uSharp)-b*uSharp,0.,1.);
   }
   return c;
 }
 void main(){
   vec3 c=mira(tA,uZoomA,uCovA,uTxA);
   if(uMix>.001){ c=mix(c,mira(tB,uZoomB,uCovB,uTxB),uMix); }
   gl_FragColor=vec4(c,1.);
 }`});
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), mat); quad.frustumCulled=false; scene.add(quad);

/* ---------- estado de la mirada ---------- */
let H = 180*RAD, T = 0, FOV = 78*RAD;         // rumbo, inclinación, campo visual vertical
let vH = 0, vT = 0, arrastrando = false, tocado = false, sucio = true;
let actual = null, enViaje = false;
const F = new THREE.Vector3(), R = new THREE.Vector3(), UP = new THREE.Vector3();
function base(){
  const ch=Math.cos(H), sh=Math.sin(H), ct=Math.cos(T), s2=Math.sin(T);
  F.set(sh*ct, ch*ct, s2); R.set(ch,-sh,0); UP.set(-sh*s2,-ch*s2,ct);
  U.uF.value.copy(F); U.uR.value.copy(R); U.uU.value.copy(UP);
  U.uTan.value=Math.tan(FOV/2);
}
function medir(){
  const w=window.innerWidth, h=window.innerHeight;
  renderer.setSize(w,h,false); U.uAspect.value=w/h; sucio=true;
  // en pantallas angostas (celular vertical) abrir un poco más el campo
  FOV = Math.min(FOV, 100*RAD);
}
window.addEventListener('resize', medir);

/* ---------- panoramas ---------- */
const cargador = new THREE.TextureLoader();
const cache = new Map();
function pano(id){
  if(cache.has(id)){ const t=cache.get(id); cache.delete(id); cache.set(id,t); return t; }
  const pr = new Promise((ok,mal)=>{
    cargador.load(`pano/${id}.jpg?v=${VER}`, tx=>{
      tx.colorSpace=THREE.NoColorSpace; tx.generateMipmaps=false;
      tx.minFilter=THREE.LinearFilter; tx.magFilter=THREE.LinearFilter;
      tx.wrapS=THREE.RepeatWrapping; tx.wrapT=THREE.ClampToEdgeWrapping;
      ok(tx);
    }, undefined, ()=>{ cache.delete(id); mal(new Error('sin imagen '+id)); });
  });
  cache.set(id,pr);
  if(cache.size>7){ // soltar las más viejas (menos la actual)
    for(const [k,v] of cache){ if(cache.size<=7) break; if(actual && k===actual.id) continue; cache.delete(k); v.then(t=>t.dispose()).catch(()=>{}); }
  }
  return pr;
}
const cov = n => ((n.cov||180)*RAD);
const texel = tx => new THREE.Vector2(1/tx.image.width, 1/tx.image.height);

/* ---------- puntos para caminar ---------- */
const hot = document.getElementById('hot');
let marcas = [];
function armarMarcas(){
  hot.innerHTML=''; marcas=[];
  for(const [id,at,txt,tipo] of actual.links){
    const d=POR_ID[id]; if(!d) continue;
    const w = at || [d.p[0],d.p[1],d.p[2]-1.5];
    const b=document.createElement('button');
    b.className='hs'+(tipo==='esc'?' esc':'');
    b.innerHTML=`<span class="ring"></span><span class="lb">${tipo==='esc'?(w[2]>actual.p[2]-1.2?'↑ ':'↓ '):''}${txt||d.n}</span>`;
    b.addEventListener('click',e=>{e.stopPropagation(); tocado=true; caminar(id,w);});
    b.addEventListener('pointerenter',()=>{ tocado=true; });
    hot.appendChild(b); marcas.push({el:b,w,id,esc:tipo==='esc'});
  }
  sucio=true;
}
function ubicarMarcas(){
  const w=window.innerWidth,h=window.innerHeight,tv=Math.tan(FOV/2),th=tv*w/h;
  for(const m of marcas){
    const dx=m.w[0]-actual.p[0], dy=m.w[1]-actual.p[1], dz=m.w[2]-actual.p[2];
    const cz=dx*F.x+dy*F.y+dz*F.z;
    if(cz<0.08 || enViaje){ m.el.style.display='none'; continue; }
    const cx=dx*R.x+dy*R.y, cy=dx*UP.x+dy*UP.y+dz*UP.z;
    const sx=cx/(cz*th), sy=cy/(cz*tv);
    if(Math.abs(sx)>1.2||Math.abs(sy)>1.25){ m.el.style.display='none'; continue; }
    const dist=Math.hypot(dx,dy,dz), hd=Math.hypot(dx,dy);
    m.el.style.display='flex';
    if(m.esc){
      m.el.style.width='auto';
      m.el.style.transform=`translate(${(sx*.5+.5)*w}px,${(1-(sy*.5+.5))*h}px) translate(-50%,-50%)`;
    }else{
      const tam=Math.max(38,Math.min(118, 330/dist/(tv/0.8)));
      const aplast=Math.max(.3,Math.min(1,Math.abs(dz)/Math.max(hd,.01)*1.25));
      m.el.style.width=tam+'px';
      m.el.style.transform=`translate(${(sx*.5+.5)*w}px,${(1-(sy*.5+.5))*h}px) translate(-50%,-${50*aplast}%)`;
      m.el.firstChild.style.transform=`scaleY(${aplast})`;
      m.el.firstChild.style.transformOrigin='50% 0';
      m.el.lastChild.style.marginTop=(6-tam*(1-aplast))+'px';
    }
  }
}

/* ---------- moverse ---------- */
const suave = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const animar = (ms,fn) => new Promise(ok=>{ const t0=performance.now(); (function paso(){ const t=Math.min(1,(performance.now()-t0)/ms); fn(t); sucio=true; t<1?requestAnimationFrame(paso):ok(); })(); });
function hacia(a,b){ let d=(b-a)%(2*Math.PI); if(d>Math.PI) d-=2*Math.PI; if(d<-Math.PI) d+=2*Math.PI; return d; }

async function caminar(id, w){
  if(enViaje||!POR_ID[id]) return;
  enViaje=true; vH=vT=0; ocultarAyuda();
  const dst=POR_ID[id], carga=pano(id);
  if(w){ // girar hacia donde vamos
    const dx=w[0]-actual.p[0], dy=w[1]-actual.p[1], dz=w[2]-actual.p[2];
    const h1=Math.atan2(dx,dy), dH=hacia(H,h1), H0=H, T0=T, T1=Math.max(-.5,Math.min(.35,Math.atan2(dz,Math.hypot(dx,dy))*.45));
    if(Math.abs(dH)>.03||Math.abs(T1-T0)>.03) await animar(Math.min(520,200+Math.abs(dH)*260), t=>{ const e=suave(t); H=H0+dH*e; T=T0+(T1-T0)*e; });
  }
  turno++;                                   // corta la precarga en curso: lo que pide la persona va primero
  const velo=document.getElementById('velo'), aviso=setTimeout(()=>velo.classList.add('on'),350);
  let tx;
  try{ tx=await Promise.race([carga, new Promise((_,mal)=>setTimeout(()=>mal(new Error('demora')),20000))]); }
  catch(e){ clearTimeout(aviso); velo.classList.remove('on'); enViaje=false; sucio=true; return; }
  clearTimeout(aviso); velo.classList.remove('on');
  U.tB.value=tx; U.uCovB.value=cov(dst); U.uTxB.value=texel(tx);
  const T0=T;
  await animar(w?900:520, t=>{
    const e=suave(t);
    if(w){ U.uZoomA.value=1-.45*e; U.uZoomB.value=1.5-.5*e; T=T0*(1-e); }
    U.uMix.value=Math.min(1,Math.max(0,(t-.12)/.76)); U.uMix.value=U.uMix.value*U.uMix.value*(3-2*U.uMix.value);
  });
  U.tA.value=tx; U.uCovA.value=cov(dst); U.uTxA.value=texel(tx);
  U.uMix.value=0; U.uZoomA.value=U.uZoomB.value=1; U.tB.value=tx;
  actual=dst; if(!w){ H=dst.h*RAD; T=0; }
  enViaje=false; llegar();
}
let turno=0;
async function precargar(ids){            // baja los puntos vecinos de a uno, sin competir con lo que se pide
  const mio=++turno;
  await new Promise(r=>setTimeout(r,500));
  for(const id of ids){ if(mio!==turno) return; try{ await pano(id); }catch(e){} }
}
function llegar(){
  document.getElementById('donde').textContent=actual.n;
  document.title='Casa Cariló · '+actual.n;
  history.replaceState(null,'','#'+actual.id);
  armarMarcas(); pintarNav(); pintarMapa();
  precargar(actual.links.map(l=>l[0]));
  sucio=true;
}

/* ---------- controles ---------- */
let px=0,py=0,pinch=0;
const dedos=new Map();
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId); dedos.set(e.pointerId,[e.clientX,e.clientY]);
  arrastrando=true; px=e.clientX; py=e.clientY; vH=vT=0; canvas.classList.add('arr'); tocado=true;
  if(dedos.size===2){ const [a,b]=[...dedos.values()]; pinch=Math.hypot(a[0]-b[0],a[1]-b[1]); }
});
canvas.addEventListener('pointermove',e=>{
  if(!dedos.has(e.pointerId)) return;
  dedos.set(e.pointerId,[e.clientX,e.clientY]);
  if(dedos.size===2){
    const [a,b]=[...dedos.values()], d=Math.hypot(a[0]-b[0],a[1]-b[1]);
    if(pinch>0){ FOV=Math.max(32*RAD,Math.min(100*RAD,FOV*pinch/d)); sucio=true; }
    pinch=d; return;
  }
  if(!arrastrando||enViaje) return;
  const k=FOV/window.innerHeight, dx=e.clientX-px, dy=e.clientY-py;
  px=e.clientX; py=e.clientY;
  H-=dx*k; T=Math.max(-1.45,Math.min(1.45,T+dy*k)); sucio=true;
  const lim=v=>Math.max(-.03,Math.min(.03,v)); vH=lim(-dx*k); vT=lim(dy*k); tMov=performance.now();
  if(Math.abs(dx)+Math.abs(dy)>2) ocultarAyuda();
});
let tMov=0;
const soltar=e=>{ dedos.delete(e.pointerId); if(dedos.size<2) pinch=0; if(dedos.size===0){ arrastrando=false; canvas.classList.remove('arr'); if(performance.now()-tMov>70){ vH=vT=0; } } };
canvas.addEventListener('pointerup',soltar); canvas.addEventListener('pointercancel',soltar);
canvas.addEventListener('wheel',e=>{ e.preventDefault(); FOV=Math.max(32*RAD,Math.min(100*RAD,FOV*(1+Math.sign(e.deltaY)*.07))); sucio=true; tocado=true; },{passive:false});
window.addEventListener('keydown',e=>{
  if(enViaje) return;
  if(e.key==='ArrowLeft'||e.key==='a'){ vH=-.035; tocado=true; }
  else if(e.key==='ArrowRight'||e.key==='d'){ vH=.035; tocado=true; }
  else if(e.key==='ArrowUp'||e.key==='w'){ // caminar hacia el punto que tengo más enfrente
    let mejor=null,ang=1.0;
    for(const m of marcas){ const a=Math.abs(hacia(H,Math.atan2(m.w[0]-actual.p[0],m.w[1]-actual.p[1]))); if(a<ang){ang=a;mejor=m;} }
    if(mejor) caminar(mejor.id,mejor.w);
  }
});
function ocultarAyuda(){ document.getElementById('ayuda').classList.add('off'); }

/* ---------- lista de ambientes ---------- */
const nav=document.getElementById('amb');
function armarNav(){
  let g=''; nav.innerHTML='';
  for(const n of NODOS){
    if(n.g!==g){ g=n.g; const s=document.createElement('span'); s.className='g'; s.textContent=g; nav.appendChild(s); }
    const b=document.createElement('button'); b.textContent=n.n; b.dataset.id=n.id;
    b.addEventListener('click',()=>{ if(actual.id!==n.id) caminar(n.id,null); });
    nav.appendChild(b);
  }
}
function pintarNav(){
  for(const b of nav.querySelectorAll('button')){ const on=b.dataset.id===actual.id; b.classList.toggle('on',on); if(on) b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}); }
}

/* ---------- plano ---------- */
const mapa=document.getElementById('mapa');
const K=2.9, MX=x=>(12-x)*K, MY=y=>(y+41)*K;       // la calle queda abajo, el parque arriba
function rect(x0,y0,x1,y1,est){ return `<rect x="${MX(Math.max(x0,x1))}" y="${MY(Math.min(y0,y1))}" width="${Math.abs(x1-x0)*K}" height="${Math.abs(y1-y0)*K}" ${est}/>`; }
function pintarMapa(){
  let s=`<svg viewBox="0 0 ${24*K} ${68*K}" xmlns="http://www.w3.org/2000/svg">`;
  s+=rect(-12,24.5,12,27,'fill="rgba(244,239,230,.07)"');                                  // calle
  s+=rect(-7,6.75,7,10.25,'fill="rgba(244,239,230,.08)" stroke="rgba(244,239,230,.25)" stroke-width=".6"'); // terraza de entrada sobre el garage
  s+=rect(-8.55,6.75,-7,13.4,'fill="rgba(244,239,230,.06)"');                               // escalera exterior
  s+=rect(-9.25,-7.1,9.25,6.75,'fill="rgba(244,239,230,.14)" stroke="rgba(244,239,230,.5)" stroke-width=".8"'); // casa (PB 18,50 x 13,85)
  s+=rect(-9.25,-11.6,9.25,-7.1,'fill="rgba(244,239,230,.06)" stroke="rgba(244,239,230,.22)" stroke-width=".6"'); // galería
  s+=rect(-5.5,-16.6,5.5,-13.1,'fill="rgba(110,190,200,.55)"');                             // pileta paralela
  s+=rect(-12,-29.55,12,-29.25,'fill="rgba(244,239,230,.25)"');                             // muro al parque alto
  const cx=MX(actual.p[0]), cy=MY(actual.p[1]), a=FOV*.62;
  const cono=(h)=>`${cx-Math.sin(h)*26},${cy+Math.cos(h)*26}`;
  s+=`<polygon id="cono" points="${cx},${cy} ${cono(H-a)} ${cono(H+a)}" fill="rgba(200,164,106,.38)"/>`;
  for(const n of NODOS){
    const cl=n.id===actual.id?'n on':(n.g===actual.g||n.g==='Exterior'?'n':'n otro');
    s+=`<circle class="${cl}" data-id="${n.id}" cx="${MX(n.p[0])}" cy="${MY(n.p[1])}" r="${n.id===actual.id?4.2:3}"><title>${n.n}</title></circle>`;
  }
  mapa.innerHTML=s+'</svg>';
}
mapa.addEventListener('click',e=>{ const id=e.target.dataset&&e.target.dataset.id; if(id&&id!==actual.id) caminar(id,null); });
function girarCono(){
  const c=document.getElementById('cono'); if(!c) return;
  const cx=MX(actual.p[0]), cy=MY(actual.p[1]), a=FOV*.62, p=h=>`${cx-Math.sin(h)*26},${cy+Math.cos(h)*26}`;
  c.setAttribute('points',`${cx},${cy} ${p(H-a)} ${p(H+a)}`);
}
document.getElementById('bt-plano').addEventListener('click',()=>mapa.classList.toggle('on'));
document.getElementById('bt-full').addEventListener('click',()=>{ document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{}); });

/* ---------- bucle ---------- */
function cuadro(){
  requestAnimationFrame(cuadro);
  if(!actual) return;
  if(!arrastrando&&!enViaje){
    if(!tocado){ H+=0.0007; sucio=true; }                         // gira solo hasta que lo toquen
    if(Math.abs(vH)>1e-4||Math.abs(vT)>1e-4){ H+=vH; T=Math.max(-1.45,Math.min(1.45,T+vT)); vH*=.9; vT*=.9; sucio=true; }
  }
  if(!sucio) return; sucio=false;
  base(); renderer.render(scene,cam); ubicarMarcas(); girarCono();
}

/* ---------- arranque ---------- */
(async function(){
  medir(); armarNav();
  if(window.innerWidth<window.innerHeight) FOV=92*RAD;
  const pedido=location.hash.slice(1);
  actual = POR_ID[pedido] || POR_ID['jardin'];
  let tx;
  try{ tx=await pano(actual.id); }
  catch(e){ document.getElementById('carga').textContent='No se pudo cargar el recorrido'; return; }
  U.tA.value=tx; U.tB.value=tx; U.uCovA.value=cov(actual); U.uTxA.value=texel(tx);
  H=actual.h*RAD; T=0;
  llegar(); cuadro();
  document.getElementById('carga').classList.add('off');
  setTimeout(ocultarAyuda, 6500);
})();
</script>
